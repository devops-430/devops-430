---
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Install SSL dependencies
  apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: yes

- name: Create SSL directory
  file:
    path: /etc/nginx/ssl
    state: directory
    mode: '0755'

- name: Generate self-signed SSL certificate
  command: >
    openssl req -x509 -nodes -days 365 -newkey rsa:2048
    -keyout /etc/nginx/ssl/nginx.key
    -out /etc/nginx/ssl/nginx.crt
    -subj "/C=US/ST=State/L=City/O=Organization/CN={{ inventory_hostname }}"
  args:
    creates: /etc/nginx/ssl/nginx.crt

- name: Configure Nginx SSL
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: '0644'
  notify: restart nginx

- name: Create default SSL site configuration
  template:
    src: default-ssl.conf.j2
    dest: /etc/nginx/sites-available/default-ssl
    mode: '0644'
  notify: restart nginx

- name: Enable SSL site
  file:
    src: /etc/nginx/sites-available/default-ssl
    dest: /etc/nginx/sites-enabled/default-ssl
    state: link
  notify: restart nginx 