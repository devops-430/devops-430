---
- name: Download k3s binary
  get_url:
    url: https://github.com/k3s-io/k3s/releases/download/v1.28.4+k3s2/k3s
    dest: /usr/local/bin/k3s
    mode: '0755'

- name: Create k3s config directory
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

- name: Install k3s server
  shell: |
    export K3S_TOKEN={{ k3s_token }}
    export K3S_KUBECONFIG_OUTPUT=/etc/rancher/k3s/k3s.yaml
    export K3S_KUBECONFIG_MODE=666
    k3s server --disable traefik --disable servicelb
  args:
    creates: /etc/rancher/k3s/k3s.yaml

- name: Wait for k3s to be ready
  command: k3s kubectl get nodes
  register: result
  until: result.rc == 0
  retries: 30
  delay: 10

- name: Install k3s agent (for worker nodes)
  shell: |
    export K3S_TOKEN={{ k3s_token }}
    export K3S_URL=https://{{ k3s_server_ip }}:6443
    k3s agent
  args:
    creates: /etc/rancher/k3s/k3s.yaml
  when: inventory_hostname in groups['k3s_workers'] 