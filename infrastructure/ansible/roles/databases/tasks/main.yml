---
- name: Install MySQL
  apt:
    name: 
      - mysql-server
      - python3-mysqldb
    state: present
    update_cache: yes

- name: Start and enable MySQL
  systemd:
    name: mysql
    state: started
    enabled: yes

- name: Set MySQL root password
  mysql_user:
    name: root
    host: "{{ item }}"
    password: "{{ mysql_root_password }}"
    state: present
  with_items:
    - localhost
    - "%"

- name: Install MongoDB
  apt:
    name: mongodb
    state: present
    update_cache: yes

- name: Start and enable MongoDB
  systemd:
    name: mongodb
    state: started
    enabled: yes

- name: Install PostgreSQL
  apt:
    name: 
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present
    update_cache: yes

- name: Start and enable PostgreSQL
  systemd:
    name: postgresql
    state: started
    enabled: yes

- name: Set PostgreSQL password
  postgresql_user:
    name: "{{ postgres_user }}"
    password: "{{ postgres_password }}"
    state: present
    login_host: localhost
    login_user: postgres 