name: CI/CD Pipeline

on:
  push:
    branches: [openlab]
  pull_request:
    branches: [openlab]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, executor, fetcher, frontend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install, Build, and Test
        working-directory: ./${{ matrix.service }}
        run: |
          npm install
          npm run build || echo "No build script for ${{ matrix.service }}"
          npm test || echo "No tests for ${{ matrix.service }}"

  docker-compose-up:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Compose Up
        run: |
          docker-compose up -d