name: CI/CD Pipeline

on:
  push:
    branches: [openlab]
  pull_request:
    branches: [openlab]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openlab/backend
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test


  executor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openlab/executor
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: pytest || echo "No tests for executor"

  fetcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openlab/fetcher
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go mod tidy
      - run: go build ./...
      - run: go test ./... || echo "No tests for fetcher"

  docker-compose-up:
    needs: [backend, frontend, executor, fetcher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker-compose up -d

