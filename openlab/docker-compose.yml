version: '3.8'

services:
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NEXT_PUBLIC_BACKEND_URL=http://backend:3001
  #     - NEXT_PUBLIC_EXECUTOR_URL=http://executor:8000
  #   depends_on:
  #     - backend

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    # environment:
    #   - MONGODB_URI=mongodb://mongodb:27017/openlab
    #   - JWT_SECRET=your_jwt_secret_key
    depends_on:
      - mongodb

  executor:
    build: ./executor
    ports:
      - "8000:8000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BACKEND_API_URL=http://localhost:3000
    depends_on:
      - backend

  fetcher:
    build: ./fetcher
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BACKEND_API_URL=http://localhost:3000
    depends_on:
      - backend

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: 