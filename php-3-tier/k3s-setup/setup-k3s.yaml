---
- name: Setup k3s cluster with master and worker
  hosts: localhost
  gather_facts: false
  collections:
    - amazon.aws
    - community.aws
  vars:
    region: "us-east-1"
    instance_type: "t3.medium"
    aws_profile: "lab"

  environment:
    AWS_PROFILE: "{{ aws_profile }}"

  tasks:
    - name: Verify AWS credentials
      amazon.aws.aws_caller_info:
        region: "{{ region }}"
      register: aws_info

    - name: Display AWS account info
      debug:
        msg: "Authenticated as {{ aws_info.account }} in region {{ region }}"

    - name: Get Ubuntu AMI
      amazon.aws.ec2_ami_info:
        filters:
          name: "ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*"
        owners: ["099720109477"]
        region: "{{ region }}"
      register: ami_info

    - name: Debug AMI info
      debug:
        var: ami_info

    - name: Print AMI ID
      debug:
        msg: "AMI ID: {{ ami_info.images[0].image_id if ami_info.images else 'No AMI found' }}"

    - name: Get default VPC and subnet
      amazon.aws.ec2_vpc_net_info:
        filters:
          "tag:Name": "default"
        region: "{{ region }}"
      register: vpc_info

    - name: Debug VPC info
      debug:
        var: vpc_info

    - name: Get all VPCs if default not found
      amazon.aws.ec2_vpc_net_info:
        region: "{{ region }}"
      register: all_vpcs
      when: vpc_info.vpcs | length == 0

    - name: Debug all VPCs
      debug:
        var: all_vpcs
      when: vpc_info.vpcs | length == 0

    - name: Set VPC info
      set_fact:
        vpc_info: "{{ all_vpcs }}"
      when: vpc_info.vpcs | length == 0

    - name: Fail if no VPCs found
      fail:
        msg: "No VPCs found in region {{ region }}. Please create a VPC first."
      when: vpc_info.vpcs | length == 0

    - name: Get subnets for the VPC
      amazon.aws.ec2_vpc_subnet_info:
        filters:
          vpc-id: "{{ vpc_info.vpcs[0].vpc_id }}"
        region: "{{ region }}"
      register: subnet_info

    - name: Debug subnet info
      debug:
        var: subnet_info

    - name: Create security group
      amazon.aws.ec2_security_group:
        name: k3s-sg
        description: "Security group for k3s"
        vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
        region: "{{ region }}"
        rules:
          - proto: tcp
            from_port: 1
            to_port: 65535
            cidr_ip: "0.0.0.0/0"
          - proto: udp
            from_port: 1
            to_port: 65535
            cidr_ip: "0.0.0.0/0"
        state: present
      register: sg_info

    - name: Debug security group info
      debug:
        var: sg_info

    - name: Create EFS file system
      community.aws.efs:
        state: present
        name: "k3s-efs"
        region: "{{ region }}"
        tags:
          Name: "k3s-efs"
          Purpose: "k3s-storage"
        targets:
          - subnet_id: "{{ subnet_info.subnets[0].subnet_id }}"
            security_groups: ["{{ sg_info.group_id }}"]
      register: efs_info

    - name: Debug EFS info
      debug:
        var: efs_info

    - name: Debug EFS info structure
      debug:
        msg: |
          EFS Info Keys: {{ efs_info.keys() | list }}
          EFS Info Type: {{ efs_info | type_debug }}

    - name: Create key pair
      amazon.aws.ec2_key:
        name: k3s-key
        region: "{{ region }}"
        key_material: "{{ lookup('file', './k3s-key.pub') }}"
        state: present

    - name: Debug variables for EC2 creation
      debug:
        msg: |
          Instance Type: {{ instance_type }}
          AMI ID: {{ ami_info.images[0].image_id }}
          Key Name: k3s-key
          Security Groups: ["k3s-sg"]
          Subnet ID: {{ subnet_info.subnets[0].subnet_id }}
          Region: {{ region }}

    - name: Create master node
      amazon.aws.ec2_instance:
        name: "k3s-master"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_info.images[0].image_id }}"
        key_name: k3s-key
        vpc_subnet_id: "{{ subnet_info.subnets[0].subnet_id }}"
        region: "{{ region }}"
        network_interfaces:
          - assign_public_ip: true
            groups:
              - k3s-sg
        tags:
          Name: "k3s-master"
          Role: "master"
        wait: true
        state: present
      register: master_instance

    - name: Debug master instance info
      debug:
        var: master_instance

    - name: Create worker node
      amazon.aws.ec2_instance:
        name: "k3s-worker"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_info.images[0].image_id }}"
        key_name: k3s-key
        vpc_subnet_id: "{{ subnet_info.subnets[0].subnet_id }}"
        region: "{{ region }}"
        network_interfaces:
          - assign_public_ip: true
            groups:
              - k3s-sg
        tags:
          Name: "k3s-worker"
          Role: "worker"
        wait: true
        state: present
      register: worker_instance

    - name: Wait for instances to be ready
      pause:
        seconds: 30

    - name: Create inventory file
      copy:
        dest: ./k3s-inventory.ini
        content: |
          [master]
          {{ master_instance.instances[0].public_ip_address }} ansible_user=ubuntu ansible_ssh_private_key_file=./k3s-key ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          [worker]
          {{ worker_instance.instances[0].public_ip_address }} ansible_user=ubuntu ansible_ssh_private_key_file=./k3s-key ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

          [k3s_cluster:children]
          master
          worker

    - name: Display cluster info
      debug:
        msg: |
          K3s Cluster Created!
          
          Master: {{ master_instance.instances[0].public_ip_address }}
          Worker: {{ worker_instance.instances[0].public_ip_address }}
          
          Next: ansible-playbook -i k3s-inventory.ini configure-k3s.yaml

    - name: Add master to inventory
      add_host:
        name: "{{ master_instance.instances[0].public_ip_address }}"
        groups: master
        ansible_user: ubuntu
        ansible_ssh_private_key_file: ./k3s-key
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

    - name: Add worker to inventory
      add_host:
        name: "{{ worker_instance.instances[0].public_ip_address }}"
        groups: worker
        ansible_user: ubuntu
        ansible_ssh_private_key_file: ./k3s-key
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

    - name: Add k3s_cluster group
      group_by:
        key: k3s_cluster

- name: Configure k3s cluster
  hosts: master:worker
  become: true
  gather_facts: true
  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    region: "us-east-1"

  tasks:
    - name: Set hostname
      hostname:
        name: "{{ 'k3s-master' if inventory_hostname in groups['master'] else 'k3s-worker' }}"

    - name: Update /etc/hostname
      copy:
        content: "{{ 'k3s-master' if inventory_hostname in groups['master'] else 'k3s-worker' }}"
        dest: /etc/hostname
        mode: '0644'

    - name: Update /etc/hosts
      lineinfile:
        path: /etc/hosts
        line: "{{ item }} {{ 'k3s-master' if item in groups['master'] else 'k3s-worker' }}"
        state: present
      loop: "{{ groups['master'] + groups['worker'] }}"

    - name: Install NFS client packages
      apt:
        name:
          - nfs-common
        state: present
        update_cache: yes

    - name: Create PHP demo app data directory
      file:
        path: /var/phpdemoapp/data
        state: directory
        mode: '0755'
        owner: ubuntu
        group: ubuntu

    - name: Mount EFS to PHP demo app data directory
      mount:
        path: /var/phpdemoapp/data
        src: "{{ hostvars['localhost']['efs_info']['efs']['file_system_id'] }}.efs.{{ region }}.amazonaws.com:/"
        fstype: nfs4
        opts: nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2
        state: mounted

    - name: Set EFS mount permissions
      file:
        path: /var/phpdemoapp/data
        mode: '0777'
        recurse: yes

    - name: Add EFS mount to fstab for persistence
      lineinfile:
        path: /etc/fstab
        line: "{{ hostvars['localhost']['efs_info']['efs']['file_system_id'] }}.efs.{{ region }}.amazonaws.com:/ /var/phpdemoapp/data nfs4 nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2 0 0"
        state: present

    - name: Install k3s server on master
      shell: curl -sfL https://get.k3s.io | sh -
      when: inventory_hostname in groups['master']

    - name: Wait for k3s server
      uri:
        url: https://localhost:6443/ping
        method: GET
        validate_certs: false
        status_code: 200
      register: k3s_ready
      until: k3s_ready.status == 200
      retries: 30
      delay: 10
      when: inventory_hostname in groups['master']

    - name: Get node token from master
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token
      when: inventory_hostname in groups['master']

    - name: Set token fact
      set_fact:
        k3s_token: "{{ node_token.content | b64decode }}"
      when: inventory_hostname in groups['master']

    - name: Copy token to worker
      copy:
        content: "{{ hostvars[groups['master'][0]]['k3s_token'] }}"
        dest: /tmp/k3s-token
        mode: '0600'
      when: inventory_hostname in groups['worker']

    - name: Install k3s agent on worker
      shell: curl -sfL https://get.k3s.io | K3S_URL=https://k3s-master:6443 K3S_TOKEN=$(cat /tmp/k3s-token) sh -
      when: inventory_hostname in groups['worker']

    - name: Wait for worker to join
      shell: k3s kubectl get nodes
      register: nodes
      until: nodes.stdout_lines | length >= 2
      retries: 20
      delay: 15
      when: inventory_hostname in groups['master']

    - name: Install Helm
      shell: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      when: inventory_hostname in groups['master']

    - name: Configure Helm to use k3s kubeconfig
      shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        helm repo add aws-efs-csi-driver https://kubernetes-sigs.github.io/aws-efs-csi-driver/
        helm repo update
        helm upgrade --install aws-efs-csi-driver aws-efs-csi-driver/aws-efs-csi-driver \
          --namespace kube-system \
          --set controller.serviceAccount.create=false \
          --set controller.serviceAccount.name=efs-csi-controller-sa \
          --kubeconfig /etc/rancher/k3s/k3s.yaml
      when: inventory_hostname in groups['master']

    - name: Wait for EFS CSI Driver to be ready
      shell: k3s kubectl wait --for=condition=ready pod -l app=efs-csi-node -n kube-system --timeout=300s
      when: inventory_hostname in groups['master']

    - name: Show cluster status
      shell: |
        echo "=== K3s Cluster Status ==="
        k3s kubectl get nodes
        echo ""
        echo "=== Cluster Info ==="
        k3s kubectl cluster-info
        echo ""
        echo "=== EFS Mount Status ==="
        df -h /var/phpdemoapp/data
        echo ""
        echo "=== EFS File System Info ==="
        echo "EFS ID: {{ hostvars['localhost']['efs_info']['efs']['file_system_id'] }}"
        echo "EFS DNS: {{ hostvars['localhost']['efs_info']['efs']['file_system_id'] }}.efs.{{ region }}.amazonaws.com"
        echo ""
        echo "=== EFS CSI Driver Status ==="
        k3s kubectl get pods -n kube-system | grep efs-csi
        echo ""
        echo "=== Storage Classes ==="
        k3s kubectl get storageclass
      when: inventory_hostname in groups['master']
      register: cluster_status

    - name: Display cluster status
      debug:
        msg: "{{ cluster_status.stdout }}"
      when: inventory_hostname in groups['master']

    - name: Clean up token
      file:
        path: /tmp/k3s-token
        state: absent
      when: inventory_hostname in groups['worker']
    
    - name: Allow ubuntu user to use kubectl
      shell: |
        sudo chown ubuntu:ubuntu /etc/rancher/k3s/k3s.yaml
        sudo chmod 644 /etc/rancher/k3s/k3s.yaml
      when: inventory_hostname in groups['master']