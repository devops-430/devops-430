apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: httpd:latest
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        ports:
        - containerPort: 80
        volumeMounts:
        - name: frontend
          mountPath: /usr/local/apache2/htdocs
      volumes:
      - name: frontend
        hostPath:
          path: /home/ubuntu/openlabfree/php-3-tier/frontend
          type: DirectoryOrCreate