---
- name: Deploy frontend via Docker on remote host
  hosts: frontend
  become: true
  vars:
    deploy_dir: /home/ubuntu/deployment
    local_frontend_dir: /home/ubuntu/openlabfree/php-3-tier/frontend
    local_backend_dir: /home/ubuntu/openlabfree/php-3-tier/api
    remote_frontend_dir: "{{ deploy_dir }}/frontend"
    remote_backend_dir: "{{ deploy_dir }}/api"
    frontend_container_name: frontend-httpd
    backend_container_name: backend-httpd

  tasks:
    - name: Ensure deployment directory exists
      file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy local frontend folder to remote deployment directory
      copy:
        src: "{{ local_frontend_dir }}"
        dest: "{{ deploy_dir }}"
        owner: ubuntu
        group: ubuntu
        mode: '0755'
    - name: Copy local backend folder to remote deployment directory
      copy:
        src: "{{ local_backend_dir }}"
        dest: "{{ deploy_dir }}"
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: remove container if exist
      shell: |
        docker rm -f {{ frontend_container_name }} || true
        docker rm -f {{ backend_container_name }} || true
    - name: Run the app
      shell: |
        docker run -d \
        -p 3000:80 \
        -v {{ remote_frontend_dir }}:/usr/local/apache2/htdocs \
        --name={{ frontend_container_name }} \
        httpd:latest
        docker run -d \
        -p 5000:80 \
        -v {{ remote_backend_dir }}:/var/www/html \
        --name={{ backend_container_name }} \
        httpd:latest